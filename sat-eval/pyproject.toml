[project]
name = "sateval"
version = "0.1.0"
description = "Offline benchmark: small local models on SAT-style questions"
requires-python = ">=3.12"
dependencies = ["httpx>=0.27", "pydantic>=2.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sateval"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
